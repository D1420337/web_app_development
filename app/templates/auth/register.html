{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">會員註冊</h3>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">使用者名稱 / 顯示名稱</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">學校電子郵件</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密碼</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">帳號身分</label>
                        <select class="form-select" id="role" name="role">
                            <option value="student">一般學生</option>
                            <option value="club">系學會 / 社團</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">註冊帳號</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <span class="text-muted">已經有帳號了？</span> <a href="{{ url_for('auth.login') }}">前往登入</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
