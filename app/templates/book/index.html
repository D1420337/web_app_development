{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-12 text-center mt-5">
        <h1>歡迎來到二手書交換平台</h1>
        <p class="lead">這裡可以瀏覽與交換校內的二手課本！</p>
        {% if not session.get('user_id') %}
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-3">立即登入</a>
            <a href="{{ url_for('auth.register') }}" class="btn btn-outline-secondary mt-3 ms-2">註冊帳號</a>
        {% else %}
            <p>您已登入為：{{ session.get('username') }}</p>
            <a href="{{ url_for('book.create') }}" class="btn btn-success mt-3">我要賣書</a>
        {% endif %}
    </div>
</div>
{% endblock %}
